databaseChangeLog:
  - changeSet:
      id: create-recommendations-table
      author: muradbakhishli
      changes:
        - createTable:
            tableName: recommendations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: ture
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(16)
                  constraints:
                    nullable:
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()