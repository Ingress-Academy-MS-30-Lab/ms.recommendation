databaseChangeLog:
  - changeSet:
      id: create-category_based_recommendations-table
      author: muradbakhishli
      changes:
        - createTable:
            tableName: category_based_recommendations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()