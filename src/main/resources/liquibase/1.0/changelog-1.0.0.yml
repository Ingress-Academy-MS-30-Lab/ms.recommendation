databaseChangeLog:
  - changeSet:
      id: create_category_based_recommendations_table
      author: muradbakhishli
      changes:
        - createTable:
            tableName: category_based_recommendations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: NUMERIC(4,2)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
        - addUniqueConstraint:
            tableName: category_based_recommendations
            columnNames: user_id, category_id
            constraintName: uq_user_category